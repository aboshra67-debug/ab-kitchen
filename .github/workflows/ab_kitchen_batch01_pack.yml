name: AB Kitchen V0.7 - Package first 20 photos
on:
  push:
    branches:
      - assets/v07-photos-batch-01-20
    paths:
      - .github/workflows/ab_kitchen_batch01_pack.yml
permissions:
  contents: write
jobs:
  package:
    name: Validate and package 20 JPEG photos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate recipe IDs, photos and package
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          from PIL import Image
          root = Path('deliverables/v07/photo_batch_01')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          recipes = manifest['recipes']
          assert len(recipes) == 20, f'Expected 20 recipe images: got {len(recipes)}'
          ids = [r['recipe_id'] for r in recipes]
          assert len(set(ids)) == 20, 'Duplicate recipe ID'
          photos = sorted((root / 'photos').glob('*.jpg'))
          assert len(photos) == 20, f'Expected 20 JPEGs: got {len(photos)}'
          checksums = {}
          for r in recipes:
              recipe_id = r['recipe_id']
              photo = root / r['filename']
              assert photo.is_file() and photo.name == recipe_id + '.jpg', recipe_id
              with Image.open(photo) as im:
                  assert im.format == 'JPEG', photo
                  w, h = im.size
                  assert w >= 1000 and h >= 700, (recipe_id,w,h)
                  im.verify()
              digest = hashlib.sha256(photo.read_bytes()).hexdigest()
              assert digest not in checksums.values(), f'Duplicate image: {recipe_id}'
              checksums[recipe_id] = digest
          output = root / 'AB_Kitchen_V0.7_First20_Separate_JPG.zip'
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for r in recipes:
                  photo = root / r['filename']
                  z.write(photo, arcname=photo.name)
              z.writestr('MANIFEST.json', json.dumps(manifest, ensure_ascii=False, indent=2))
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == 21
          print('Validated 20 unique JPEGs and zipped:', output, output.stat().st_size)
          PY
      - name: Commit downloadable ZIP on staging branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/v07/photo_batch_01/AB_Kitchen_V0.7_First20_Separate_JPG.zip
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish vetted 20-photo JPG ZIP (no app code changes)"
            git push origin HEAD:assets/v07-photos-batch-01-20
          fi
