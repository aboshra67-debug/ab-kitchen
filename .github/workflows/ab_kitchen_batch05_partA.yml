name: AB Kitchen V0.7 batch05 part A - 12 image PDF ZIP
on:
  push:
    branches:
      - 'assets/v07-photos-batch05-06-safe'
    paths:
      - '.github/workflows/ab_kitchen_batch05_partA.yml'
      - 'tools/build_batch05_partA_catalog.py'
      - 'assets/photos_batch05/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: python -m pip install --disable-pip-version-check Pillow reportlab arabic-reshaper python-bidi PyMuPDF
      - name: Validate source images and create PDF ZIP
        run: python tools/build_batch05_partA_catalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Kitchen-V07-Batch05-PartA-12-PDF-ZIP
          path: deliverables/AB_Kitchen_V07_Batch05_PartA_12_*
          if-no-files-found: error
          retention-days: 90
      - name: Publish files only on safe asset branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/AB_Kitchen_V07_Batch05_PartA_12_*
          if git diff --cached --quiet; then
            echo 'Already committed'
          else
            git commit -m 'deliverables: publish batch05 part A 12 independent food images with PDF ZIP'
            git push origin HEAD:assets/v07-photos-batch05-06-safe
          fi
