name: AB Kitchen Flutter CI — Android and iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android analysis, tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project (preserve existing Dart files)
        run: flutter create --project-name ab_kitchen --org com.absoftware --platforms=android .
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Publish debug APK after ALL checks pass
        uses: actions/upload-artifact@v4
        with:
          name: AB-Kitchen-V0.2-Android-DEBUG
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS analysis, tests and unsigned simulator build
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project (preserve existing Dart files)
        run: flutter create --project-name ab_kitchen --org com.absoftware --platforms=ios .
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build unsigned iOS simulator binary
        run: flutter build ios --simulator --debug