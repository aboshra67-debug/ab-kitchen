name: AB Kitchen V0.7 - pack verified batch06 three photos
on:
  push:
    branches:
      - assets/v07-batch06-three-validated
    paths:
      - .github/workflows/ab_kitchen_batch06_delivery.yml
      - tools/build_batch06_delivery.py
      - assets/photos_batch06/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging and PDF QA dependencies
        run: python -m pip install --disable-pip-version-check Pillow reportlab arabic-reshaper python-bidi PyMuPDF
      - name: Verify three images and produce PDF ZIP
        run: python tools/build_batch06_delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Kitchen-Batch06-3-JPG-PDF-ZIP
          path: |
            deliverables/AB_Kitchen_V07_Batch06_03_Standalone_Photos.*
            deliverables/AB_Kitchen_V07_Batch06_03_Standalone_Photos_Manifest.json
          if-no-files-found: error
      - name: Commit delivery on isolated image branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/AB_Kitchen_V07_Batch06_03_Standalone_Photos*
          if git diff --cached --quiet; then echo "Already committed"; else git commit -m "deliverables: three new food photos in JPG ZIP and PDF"; git push origin HEAD:assets/v07-batch06-three-validated; fi
