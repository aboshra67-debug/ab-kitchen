name: ab_kitchen
description: AB Kitchen - Interactive world recipes and home cooking assistant.
publish_to: none
version: 0.6.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/recipes_ar.json
    - assets/branding/ab_kitchen_logo.jpg
    - assets/photos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/ab_kitchen_app_icon.png
  remove_alpha_ios: true