<script>
(()=>{
const recipes=JSON.parse(document.getElementById('recipes-data').textContent);
const countries={eg:['مصر','🇪🇬'],sa:['السعودية','🇸🇦'],sy:['سوريا','🇸🇾'],tr:['تركيا','🇹🇷'],it:['إيطاليا','🇮🇹'],in:['الهند','🇮🇳'],ma:['المغرب','🇲🇦'],lb:['لبنان','🇱🇧']};
const days=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];const meals=['إفطار','غداء','عشاء'];
const defaults=()=>({favorites:[],pantry:[],shopping:[],plan:{},dark:false,servings:4});
let s;try{s={...defaults(),...JSON.parse(localStorage.getItem('abk_preview_v1')||'{}')}}catch(e){s=defaults()}
let tab='home',country='all',category='الكل',search='',faves=false,pantrySearch='',detail=null,portions=4,readied=[],step=0,timerId=null,tLeft=0;
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n.toFixed(2)).toString();
function save(){try{localStorage.setItem('abk_preview_v1',JSON.stringify(s))}catch(e){toast('التخزين غير متاح في هذا المتصفح')}}
function toast(message){$('toast').innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>$('toast').innerHTML='',2300)}
function setTab(t){tab=t;render()}
function title(){return {home:'مطبخ العالم',pantry:'مطبخي',planner:'جدول الأسبوع',shopping:'قائمة المشتريات',assistant:'مساعد الطبخ'}[tab]||''}
const iconFor={home:'🌍',pantry:'🧺',planner:'📅',shopping:'🛒',assistant:'✨'};
function render(){document.body.classList.toggle('dark',!!s.dark);$('pageTitle').textContent=title();$('tabs').innerHTML=Object.keys(iconFor).map((t,i)=>`<button class="tab ${tab===t?'active':''}" data-act="tab" data-id="${t}"><span class="ti">${iconFor[t]}</span>${['اكتشف','مطبخي','الجدول','المشتريات','المساعد'][i]}</button>`).join('');
$('main').innerHTML=({home:home,pantry:pantry,planner:planner,shopping:shopping,assistant:assistant}[tab])(); if(tab==='home')renderHomeResults();if(tab==='pantry')renderPantryList()}
function card(r,label=''){return `<article class="recipe"><div class="pic" data-act="recipe" data-id="${r.id}">${r.emoji}</div><div class="data" data-act="recipe" data-id="${r.id}"><div class="name">${esc(r.name)}</div><div class="meta">${esc(label || countries[r.country][1]+' '+countries[r.country][0]+' • '+r.category)}</div><div class="time">◷ ${r.minutes} دقيقة • ${esc(r.difficulty)}</div></div><button class="fav" data-act="fav" data-id="${r.id}" title="المفضلة">${s.favorites.includes(r.id)?'♥':'♡'}</button></article>`}
function home(){const cats=['الكل',...new Set(recipes.map(r=>r.category))];return `<div class="hero"><div style="flex:1"><h1>كل مطابخ العالم<br>في مطبخك ✨</h1><p>نكهات مصر والسعودية وسوريا والعالم</p><span class="pill">✓ ${recipes.length} وصفة • ${Object.keys(countries).length} مطابخ</span></div><div class="food">🍲</div></div><div class="section"><h2>تدور على إيه النهارده؟</h2></div><input id="search" class="search" type="search" placeholder="🔎 ابحث عن أكلة أو مكوّن..." value="${esc(search)}"><div class="section"><h2>المطابخ</h2></div><div class="filters">${[['all','🌍 الكل'],...Object.entries(countries).map(([id,x])=>[id,x[1]+' '+x[0]])].map(([id,label])=>`<button class="chip ${country===id?'active':''}" data-act="country" data-id="${id}">${esc(label)}</button>`).join('')}</div><div class="filters">${cats.map(c=>`<button class="chip ${category===c?'active':''}" data-act="category" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="section"><h2>الوصفات <span id="resultCount" class="count"></span></h2><button class="smallbtn" data-act="toggleFav">${faves?'♥ المفضلة فقط':'♡ المفضلة'}</button></div><section id="recipeResults"></section>`}
function renderHomeResults(){const result=recipes.filter(r=>(country==='all'||r.country===country)&&(category==='الكل'||r.category===category)&&(!faves||s.favorites.includes(r.id))&&(!search||[r.name,r.description,...r.tags,...r.ingredients.map(i=>i.name)].some(t=>t.includes(search))));$('resultCount').textContent=`(${result.length})`;$('recipeResults').innerHTML=result.map(r=>card(r)).join('')||'<div class="empty">مفيش وصفات مطابقة، جرّب بحث تاني.</div>'}
function pantry(){return `<h1 class="lead">إيه الموجود عندك؟ 🧺</h1><p class="desc">حدد المكونات الموجودة عندك وهنرتّب الوصفات الأقرب لمطبخك.</p><input id="pantrySearch" class="search" placeholder="🔎 دور على مكوّن..." value="${esc(pantrySearch)}"><div class="section"><h2>مكونات البيت</h2><span class="count">تم تحديد ${s.pantry.length}</span></div><div class="pantry-grid" id="pantryList"></div><div class="section"><h2>تقدر تطبخ إيه؟</h2></div><div id="pantryRecipes"></div>`}
function rank(r){return r.ingredients.filter(i=>s.pantry.includes(i.name)).length/r.ingredients.length}
function renderPantryList(){const all=[...new Set(recipes.flatMap(r=>r.ingredients.map(i=>i.name)))].sort().filter(x=>x.includes(pantrySearch));$('pantryList').innerHTML=all.map(x=>`<label class="pantry-item"><input type="checkbox" data-act="pantryToggle" data-id="${esc(x)}" ${s.pantry.includes(x)?'checked':''}>${esc(x)}</label>`).join('')||'<p class="empty">مفيش مكوّن مطابق.</p>';const list=recipes.filter(r=>rank(r)>0).sort((a,b)=>rank(b)-rank(a)||a.minutes-b.minutes).slice(0,8);$('pantryRecipes').innerHTML=list.map(r=>card(r,`${r.ingredients.filter(i=>s.pantry.includes(i.name)).length} من ${r.ingredients.length} مكونات متوفرة`)).join('')||'<div class="empty">حدد كام مكوّن الأول علشان تظهر الاقتراحات.</div>'}
function shopping(){return `<h1 class="lead">قائمة المشتريات 🛒</h1><p class="desc">${s.shopping.length} صنف في القائمة، ${s.shopping.filter(i=>i.checked).length} تم شراؤه.</p><div class="row"><button class="mainbtn" data-act="manual">+ إضافة مكوّن</button><button class="ghost" data-act="clearChecked">حذف المكتمل</button></div><div class="panel">${s.shopping.length?s.shopping.map((i,n)=>`<div class="itemrow ${i.checked?'done':''}"><input type="checkbox" data-act="shopCheck" data-id="${n}" ${i.checked?'checked':''}><div class="mid"><b>${esc(i.name)}</b><div class="qty">${fmt(i.quantity)} ${esc(i.unit)}</div></div><button class="smallbtn" data-act="shopDel" data-id="${n}">✕</button></div>`).join(''):'<div class="empty">لسه مفيش مشتريات. افتح أي وصفة وأضف مكوناتها الناقصة.</div>'}</div>`}
function planner(){return `<h1 class="lead">خطة الأكل الأسبوعية 📅</h1><p class="desc">اختار أكلة لكل وجبة، وبعدين ضيف مكونات الأسبوع للمشتريات.</p><button class="mainbtn wide" data-act="plannerShopping">🛒 أضف مقادير خطة الأسبوع للمشتريات</button><div style="height:11px"></div>${days.map((d,i)=>`<div class="day"><h3>${d}</h3>${meals.map((m,j)=>{const r=recipes.find(x=>x.id===s.plan[i+':'+j]);return `<div class="meal"><span>${['🌅','☀️','🌙'][j]}</span><span class="num">${m}</span><button data-act="chooseMeal" data-id="${i}:${j}">${r?esc(r.name):'＋ اختيار وجبة'}</button><span>✎</span></div>`}).join('')}</div>`).join('')}`}
let chat=[{mine:false,text:'أهلًا! 👨‍🍳 أنا مساعد الطبخ المحلي. اسألني عن وصفة سريعة أو بديل مكوّن أو إيه ممكن تطبخ بالموجود.'}];
function assistant(){return `<h1 class="lead">مساعد الطبخ ✨</h1><p class="desc">نسخة محلية بقواعد بسيطة، بدون اتصال بنموذج ذكاء اصطناعي خارجي.</p><div class="quick">${['عندي مكونات في البيت','عايز أكلة سريعة','إيه بديل اللبن؟','نصائح سلامة الطعام'].map(t=>`<button class="chip" data-act="ask" data-id="${esc(t)}">${esc(t)}</button>`).join('')}</div><div id="chat" class="chat panel">${chat.map(m=>`<div class="message ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="row"><input class="search" id="question" placeholder="اسأل عن الطبخ..." aria-label="رسالة المساعد"><button class="mainbtn" data-act="send">➤</button></div>`}
function reply(q){q=q.toLowerCase();if(q.includes('بديل')||q.includes('بدل'))return q.includes('لبن')||q.includes('حليب')?'في بعض الوصفات ممكن تستخدم حليب نباتي غير محلى بدل اللبن، لكن الطعم والقوام هيختلفوا.':'البديل المناسب بيختلف حسب الوصفة؛ قول اسم المكوّن والأكلة.';if(q.includes('عندي')||q.includes('مكونات')||q.includes('الثلاجة')){const top=recipes.filter(r=>rank(r)>.3).sort((a,b)=>rank(b)-rank(a)).slice(0,3);return top.length?'أقرب وصفات لمكوناتك:\n'+top.map(r=>`• ${r.name} (${Math.round(rank(r)*100)}٪ متوفر)`).join('\n'):'اختار مكونات البيت من تبويب «مطبخي» الأول علشان أقدر أرشح لك أكلات.'}if(q.includes('سريع')||q.includes('وقت'))return 'جرب الأكلات السريعة دي:\n'+recipes.filter(r=>r.minutes<=30).slice(0,5).map(r=>'• '+r.name+' — '+r.minutes+' دقيقة').join('\n');if(q.includes('سلامة')||q.includes('ني'))return 'افصل الأدوات المستخدمة مع الدجاج واللحم النيّ عن الأكل الجاهز. اغسل إيديك، واستخدم ميزان حرارة لضمان النضج الآمن.';if(q.includes('فرن'))return 'سخّن الفرن قبل الخبز على درجة الحرارة المطلوبة، والزمن ممكن يختلف حسب الفرن والصينية.';return 'ممكن أساعدك في الوصفات السريعة، مكونات البيت، والبدائل الأساسية. النسخة دي مساعد بقواعد محلية وليست AI سحابية.'}
function send(q){const text=(q||$('question')?.value||'').trim();if(!text)return;chat.push({mine:true,text},{mine:false,text:reply(text)});render();setTimeout(()=>{$('chat')?.scrollTo({top:$('chat').scrollHeight,behavior:'smooth'})},10)}
function addShop(name,quantity,unit){const target=s.shopping.find(x=>x.name===name&&x.unit===unit);if(target){target.quantity+=quantity;target.checked=false}else{s.shopping.push({name,quantity,unit,checked:false})}}
function showRecipe(id){detail=recipes.find(r=>r.id===id);if(!detail)return;readied=[];portions=s.servings;step=0;showDetail()}
function showDetail(){if(!detail)return;const r=detail;clearInterval(timerId);timerId=null;tLeft=0;$('modal').innerHTML=`<div class="overlay" id="cover"><div class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><b>وصفة ${esc(r.name)}</b><button class="iconbtn" data-act="close">✕</button></div><div class="sheetimg">${r.emoji}</div><h2 style="margin:5px 0">${esc(r.name)}</h2><p class="desc">${esc(r.description)}<br>◷ ${r.minutes} دقيقة • ${esc(r.difficulty)} • ${countries[r.country][1]} ${countries[r.country][0]}</p><div class="row space"><h3>المقادير</h3><div class="counter"><button data-act="portionMinus">−</button><strong>${portions} أفراد</strong><button data-act="portionPlus">＋</button></div></div>${r.ingredients.map((i,n)=>`<div class="detailrow"><label><input type="checkbox" data-act="ingReady" data-id="${n}" ${readied.includes(n)?'checked':''}>${esc(i.name)}</label><b>${fmt(i.quantity*portions/r.servings)} ${esc(i.unit)}</b></div>`).join('')}<div style="height:13px"></div><button class="ghost wide" data-act="recipeToShop">🛒 أضف المكونات الناقصة للمشتريات</button><div class="subhead">خطوات التحضير</div>${r.steps.map((i,n)=>`<div class="step"><h3>${n+1}. ${esc(i.title)}</h3><p>${esc(i.body)}</p><span class="muted">◷ ${i.minutes} دقيقة</span></div>`).join('')}<button class="mainbtn wide" data-act="cook">▶ ابدأ الطبخ خطوة بخطوة</button></div></div>`}
function renderCooking(){if(!detail)return;const r=detail;const x=r.steps[step];$('modal').innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><b>نطبخ ${esc(r.name)}</b><button class="iconbtn" data-act="close">✕</button></div><div class="sheetimg" style="height:120px;font-size:62px">${r.emoji}</div><div class="muted">الخطوة ${step+1} من ${r.steps.length}</div><div class="bar"><i style="width:${100*(step+1)/r.steps.length}%"></i></div><h2 style="text-align:center;margin:22px 0 9px">${esc(x.title)}</h2><p style="font-size:18px;text-align:center;line-height:1.8">${esc(x.body)}</p><div class="row" style="justify-content:center"><button class="ghost" data-act="speakStep">🔊 اسمع شرح الخطوة</button></div><div class="panel" style="text-align:center"><b id="clock">${tLeft?`${String(Math.floor(tLeft/60)).padStart(2,'0')}:${String(tLeft%60).padStart(2,'0')}`:`وقت مقترح ${x.minutes} دقيقة`}</b><div><button class="smallbtn" data-act="timer">⏱ تشغيل / إعادة المؤقت</button></div></div><div class="row" style="margin-top:20px"><button class="ghost" style="flex:1" data-act="prev">السابق</button><button class="mainbtn" style="flex:1" data-act="next">${step===r.steps.length-1?'خلصت ✅':'التالي ←'}</button></div></div></div>`}
function close(){clearInterval(timerId);timerId=null;detail=null;$('modal').innerHTML=''}
function settings(){ $('modal').innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><h2>الإعدادات ⚙️</h2><button class="iconbtn" data-act="close">✕</button></div><div class="panel"><label class="row space">الوضع الداكن <input type="checkbox" data-act="dark" ${s.dark?'checked':''}></label></div><div class="panel row space"><b>عدد الأشخاص الافتراضي</b><select id="defaultServings">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${s.servings===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div><p class="tip">✓ البيانات محفوظة محليًا في متصفحك فقط.<br>✓ الوصفات تعمل بدون إنترنت.<br>✓ لا يوجد AI سحابي أو مزامنة في المعاينة الحالية.</p><button class="ghost wide" data-act="reset">مسح البيانات المحلية</button></div></div>`}
function chooseMeal(key){$('modal').innerHTML=`<div class="overlay"><div class="sheet"><div class="sheethead"><b>اختار وجبة ${days[+key[0]]} • ${meals[+key[2]]}</b><button class="iconbtn" data-act="close">✕</button></div><div style="margin:12px 0"><button class="ghost wide" data-act="setMeal" data-key="${key}" data-id="">إزالة الوجبة</button></div>${recipes.map(r=>`<button class="detailrow" style="width:100%;background:transparent;border-left:0;border-right:0;border-top:0;color:var(--ink);cursor:pointer" data-act="setMeal" data-key="${key}" data-id="${r.id}"><span>${r.emoji} ${esc(r.name)}</span><span class="muted">${r.minutes} دقيقة</span></button>`).join('')}</div></div>`}
function closeAndSave(){save();close();render()}
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderHomeResults()}if(e.target.id==='pantrySearch'){pantrySearch=e.target.value;renderPantryList()}});
document.addEventListener('change',e=>{const a=e.target.dataset.act,id=e.target.dataset.id;if(a==='pantryToggle'){s.pantry=e.target.checked?[...new Set([...s.pantry,id])]:s.pantry.filter(x=>x!==id);save();render()}if(a==='shopCheck'){s.shopping[+id].checked=e.target.checked;save();render()}if(a==='ingReady'){const n=+id;readied=e.target.checked?[...readied,n]:readied.filter(x=>x!==n)}if(a==='dark'){s.dark=e.target.checked;save();closeAndSave()}if(e.target.id==='defaultServings'){s.servings=+e.target.value;save();toast('اتحفظ العدد الافتراضي')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='question'){e.preventDefault();send()}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn)return;const a=btn.dataset.act,id=btn.dataset.id;
if(a==='tab')setTab(id);
if(a==='country'){country=id;render()}
if(a==='category'){category=id;render()}
if(a==='toggleFav'){faves=!faves;render()}
if(a==='fav'){s.favorites=s.favorites.includes(id)?s.favorites.filter(x=>x!==id):[...s.favorites,id];save();render()}
if(a==='recipe')showRecipe(id);
if(a==='portionPlus'&&portions<12){portions++;showDetail()}
if(a==='portionMinus'&&portions>1){portions--;showDetail()}
if(a==='recipeToShop'&&detail){detail.ingredients.forEach((x,n)=>{if(!readied.includes(n)&&!s.pantry.includes(x.name))addShop(x.name,x.quantity*portions/detail.servings,x.unit)});save();toast('تمت إضافة المكونات الناقصة')}
if(a==='cook'){step=0;renderCooking()}
if(a==='prev'&&step>0){clearInterval(timerId);step--;tLeft=0;renderCooking()}
if(a==='next'){clearInterval(timerId);tLeft=0;if(step<detail.steps.length-1){step++;renderCooking()}else{close();toast('بالهنا والشفا! 🎉')}}
if(a==='speakStep'&&detail){if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(detail.steps[step].title+'. '+detail.steps[step].body);u.lang='ar-EG';u.rate=.85;window.speechSynthesis.speak(u)}else{toast('النطق الصوتي غير مدعوم في المتصفح')}}
if(a==='timer'&&detail){clearInterval(timerId);tLeft=detail.steps[step].minutes*60;const clock=$('clock');if(clock)clock.textContent=`${String(Math.floor(tLeft/60)).padStart(2,'0')}:${String(tLeft%60).padStart(2,'0')}`;if(tLeft>0)timerId=setInterval(()=>{tLeft--;const c=$('clock');if(c)c.textContent=`${String(Math.floor(tLeft/60)).padStart(2,'0')}:${String(tLeft%60).padStart(2,'0')}`;if(tLeft<=0){clearInterval(timerId);toast('انتهى المؤقت ✅')}},1000)}
if(a==='close')close();
if(a==='settings')settings();
if(a==='dark')return;
if(a==='reset'){if(confirm('مسح المفضلة ومكونات البيت والجدول والمشتريات؟')){s=defaults();save();close();render()}}
if(a==='manual'){const name=prompt('اسم المكوّن:');if(!name||!name.trim())return;const v=prompt('الكمية:', '1');const n=Number((v||'').replace(',','.'));if(!Number.isFinite(n)||n<=0){toast('كمية غير صالحة');return}const unit=prompt('الوحدة:', 'حبة')||'حبة';addShop(name.trim(),n,unit.trim());save();render()}
if(a==='shopDel'){s.shopping.splice(+id,1);save();render()}
if(a==='clearChecked'){s.shopping=s.shopping.filter(x=>!x.checked);save();render()}
if(a==='chooseMeal')chooseMeal(id);
if(a==='setMeal'){const key=btn.dataset.key;if(id)s.plan[key]=id;else delete s.plan[key];closeAndSave()}
if(a==='plannerShopping'){let total=0;Object.values(s.plan).forEach(id=>{const r=recipes.find(x=>x.id===id);if(r){r.ingredients.forEach(i=>{addShop(i.name,i.quantity*s.servings/r.servings,i.unit);total++})}});save();toast(total?'اتضافت مقادير خطة الأسبوع للمشتريات':'اختار وجبات الأول')}
if(a==='ask')send(id);
if(a==='send')send();
});
render();
})();
</script></body></html>
